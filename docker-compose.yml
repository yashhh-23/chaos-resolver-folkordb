services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb-m-and-a
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - falkordb-data:/data
    restart: unless-stopped
    command: ["falkordb-server", "--requirepass", "${FALKORDB_PASSWORD:-changeme_in_production}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${FALKORDB_PASSWORD:-changeme_in_production}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orgbridge-backend
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-changeme_in_production}
      - FALKORDB_SSL=false
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GRAPH_FINPAY=finpay_graph
      - GRAPH_VAULTLY=vaultly_graph
      - GRAPH_MERGED=merged_brain
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orgbridge-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  falkordb-data:
    driver: local
