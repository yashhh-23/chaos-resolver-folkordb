services:
  - type: web
    name: orgbridge-ai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /api/health
    envVars:
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        value: falkordb
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_SSL
        value: "false"
      - key: GRAPH_FINPAY
        value: finpay_graph
      - key: GRAPH_VAULTLY
        value: vaultly_graph
      - key: GRAPH_MERGED
        value: merged_brain
      - key: ENVIRONMENT
        value: production
