<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#0f172a"/>
  <!-- Brain/graph node ring -->
  <circle cx="16" cy="16" r="10" stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Central node -->
  <circle cx="16" cy="16" r="3" fill="#06b6d4"/>
  <!-- FinPay node (blue) -->
  <circle cx="8" cy="10" r="2.5" fill="#3b82f6"/>
  <!-- Vaultly node (orange) -->
  <circle cx="24" cy="10" r="2.5" fill="#f97316"/>
  <!-- Unified node (emerald) -->
  <circle cx="16" cy="25" r="2.5" fill="#10b981"/>
  <!-- Edges -->
  <line x1="8" y1="10" x2="16" y2="16" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
  <line x1="24" y1="10" x2="16" y2="16" stroke="#f97316" stroke-width="1" opacity="0.8"/>
  <line x1="16" y1="25" x2="16" y2="16" stroke="#10b981" stroke-width="1" opacity="0.8"/>
  <!-- Cross-edge -->
  <line x1="8" y1="10" x2="24" y2="10" stroke="#64748b" stroke-width="0.8" opacity="0.5"/>
</svg>
